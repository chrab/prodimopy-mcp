[project]
name = "prodimopy-mcp"
description = "MCP server that gives AI agents access to prodimopy functions, documentation and example notebooks"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Rab", email = "rab@mpe.mpg.de" }]
maintainers = [{ name = "Christian Rab", email = "rab@mpe.mpg.de" }]
keywords = ["astronomy", "astrophysics", "prodimo", "prodimopy", "mcp", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dynamic = ["version"]

dependencies = [
  "prodimopy >= 2.8, < 3",
  "mcp[cli] >= 2.0",
]

[project.urls]
Homepage = "https://github.com/chrab/prodimopy-mcp"
"Bug Reports" = "https://github.com/chrab/prodimopy-mcp/issues"
prodimopy = "https://gitlab.astro.rug.nl/prodimo/prodimopy"

[project.scripts]
prodimopy-mcp = "prodimopy_mcp.server:main"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The data files are generated by scripts/sync_data.py and are not tracked by git.
# MANIFEST.in adds them to the sdist, package-data adds them to the wheel.
[tool.setuptools.package-data]
"prodimopy_mcp.data" = ["docs/*.txt", "docs/manifest.json", "notebooks/*.ipynb"]

[tool.setuptools_scm]
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

# The prodimopy git tag (or branch) from which scripts/sync_data.py generates the
# documentation and notebook data. Raise it after each prodimopy release.
[tool.prodimopy-mcp]
prodimopy-ref = "v2.8.0"

# ─── pixi (development environments) ─────────────────────────────────────────
# pixi reads [project.dependencies]. Packages listed below are installed from
# conda-forge; version bounds are only defined in [project.dependencies].
# prodimopy is not on conda-forge yet, so pixi installs it (and its
# dependencies) from PyPI.

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.11"
mcp = "*"

[tool.pixi.pypi-dependencies]
prodimopy-mcp = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest", description = "Run the test suite" }

# Tools to build the prodimopy documentation and to generate the data.
[tool.pixi.feature.sync.dependencies]
sphinx = "*"
sphinx_rtd_theme = "*"
nbsphinx = "*"
sphinx-copybutton = "*"
sphinx-last-updated-by-git = "*"
pandoc = "*"
ipykernel = "*"
beautifulsoup4 = "*"
git = "*"

[tool.pixi.feature.sync.tasks]
sync-data = { cmd = "python scripts/sync_data.py", description = "Generate the data from the local prodimopy repo ($PRODIMOPY_SRC or ../prodimopy) at the pinned prodimopy-ref" }
sync-data-gitlab = { cmd = "python scripts/sync_data.py --source https://gitlab.astro.rug.nl/prodimo/prodimopy.git", description = "Generate the data from the prodimopy GitLab repo at the pinned prodimopy-ref" }

# Build and upload a release.
#   pixi run release-build      # check clean tree, sync data, tests, build, twine check, data check
#   pixi run upload-testpypi    # upload dist/* to TestPyPI
#   pixi run upload-pypi        # upload dist/* to PyPI
# setuptools and setuptools-scm: build backend, see [build-system] (build runs with --no-isolation)
[tool.pixi.feature.release.dependencies]
python-build = "*"
twine = "*"
setuptools = ">=64"
setuptools-scm = ">=8"

[tool.pixi.feature.release.tasks]
version = { cmd = "python -m setuptools_scm", description = "Show the version derived from the git tags" }
check-clean = { cmd = "git diff --stat --exit-code HEAD", description = "Fail if the working tree has uncommitted changes" }
build = { cmd = "rm -rf dist && python -m build --no-isolation && twine check dist/* && python scripts/check_dist.py", depends-on = [{ task = "sync-data", environment = "release" }], description = "Generate the data, build the sdist and wheel into dist/ and check them" }
release-build = { cmd = "python -m setuptools_scm", depends-on = ["check-clean", { task = "sync-data", environment = "release" }, { task = "test", environment = "release" }, "build"], description = "Check clean tree, generate data, run tests, build and check; prints the version" }
upload-testpypi = { cmd = "twine upload --verbose --repository testpypi --username __token__ dist/*", description = "Upload dist/* to TestPyPI" }
upload-pypi = { cmd = "twine upload --verbose --username __token__ dist/*", description = "Upload dist/* to PyPI" }

[tool.pixi.environments]
default = { features = ["dev", "sync"], solve-group = "default" }
release = { features = ["dev", "sync", "release"], solve-group = "default" }
